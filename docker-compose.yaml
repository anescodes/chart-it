services:

  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: app_postgres
    restart: always

    environment:
      POSTGRES_USER: chartit_user
      POSTGRES_PASSWORD: chartit_password
      POSTGRES_DB: chartit_db



    volumes:
      - postgres_data:/var/lib/postgresql/data


  # 2. AI Service (FastAPI)
  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: app_ai_service
    restart: always

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # 3. Backend (Express + TypeScript)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_backend
    restart: always

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: production
      PORT: 5000

      DATABASE_URL: postgresql://chartit_user:chartit_password@postgres:5432/chartit_db

      FASTAPI_URL: http://ai-service:8000

    depends_on:
      postgres:
        condition: service_started

      ai-service:
        condition: service_healthy


  # 4. Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app_frontend
    restart: always

    ports:
      - "5173:5173"

    depends_on:
      backend:
        condition: service_started


volumes:
  postgres_data:


networks:
  default:
    name: app_network