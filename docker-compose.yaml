version: '3.8'

services:
  # 1. خدمة الـ AI (FastAPI) - تبدأ أولاً
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: app_ai_service
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. خدمة الـ Backend (Express) - تنتظر جاهزية FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FASTAPI_URL=http://ai-service:8000
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. خدمة الـ Frontend (React + Nginx) - تنتظر جاهزية Express
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: app_network